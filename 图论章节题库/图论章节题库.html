                                <\/ul>", "explanation": "按通常无向图定义，C 只保证连通，三角形便是反例；A、B、D 均是树的等价刻画。平台对只选择 C 的作答给了部分分，未显示完整参考答案。", "noteType": "判分疑点", "note": "数学判断为 C；两账号都只得 3.0/约5.9 分。平台没有显示完整参考答案，不将其余选项猜作正确答案。", "verified": false, "searchText": "11 【多选题】 下面哪一种图不一定是树?（ ） A、 无简单回路的连通图 B、 有n 个结点n-1条边的连通图 C、 每对结点间都有通路的图 D、 连通但删去任意一条边则不连通的图 我的答案： C 3.0分"}, {"id": "405618862", "chapter": "3.1", "chapterName": "树及其等价定义", "type": "判断题", "answer": "错", "score": 5.9, "source": "shen-3-1-questions.json", "sourceQuestion": 12, "stemHtml": "<p>无向图<em>G <\/em>是由<em>k<\/em>(<em>k <\/em>≥ 2)棵树组成的森林，至少要添加<em>k<\/em>条边才能使<em>G<\/em>成为一棵树。<\/p>\n<p><br><\/p>", "optionsHtml": "", "explanation": "连接 k 个树分支只需 k−1 条边。", "noteType": "", "note": "", "verified": true, "searchText": "12 【判断题】 无向图G 是由k(k ≥ 2)棵树组成的森林，至少要添加k条边才能使G成为一棵树。 我的答案： 错 5.9分"}, {"id": "405618863", "chapter": "3.1", "chapterName": "树及其等价定义", "type": "判断题", "answer": "错", "score": 5.9, "source": "shen-3-1-questions.json", "sourceQuestion": 16, "stemHtml": "<p>任何树<em>T<\/em>都至少有两片树叶。<\/p>", "optionsHtml": "", "explanation": "至少有两片叶子的结论要求树非平凡；只有一个顶点的平凡树是反例。", "noteType": "", "note": "", "verified": true, "searchText": "16 【判断题】 任何树T都至少有两片树叶。 我的答案： 错 5.9分"}, {"id": "405618864", "chapter": "3.1", "chapterName": "树及其等价定义", "type": "判断题", "answer": "对", "score": 5.9, "source": "shen-3-1-questions.json", "sourceQuestion": 14, "stemHtml": "<p>树都是二部图。<\/p>", "optionsHtml": "", "explanation": "以任意顶点为根，按到根距离的奇偶性分为两侧即可。", "noteType": "", "note": "", "verified": true, "searchText": "14 【判断题】 树都是二部图。 我的答案： 对 5.9分"}, {"id": "405618865", "chapter": "3.1", "chapterName": "树及其等价定义", "type": "判断题", "answer": "对", "score": 5.9, "source": "shen-3-1-questions.json", "sourceQuestion": 15, "stemHtml": "<p>树中任意两个结点之间有唯一的路相连。<\/p>", "optionsHtml": "", "explanation": "若两点间有两条不同的路，它们的并中会出现圈，与树无圈矛盾。", "noteType": "", "note": "", "verified": true, "searchText": "15 【判断题】 树中任意两个结点之间有唯一的路相连。 我的答案： 对 5.9分"}, {"id": "405618866", "chapter": "3.1", "chapterName": "树及其等价定义", "type": "判断题", "answer": "对", "score": 5.9, "source": "shen-3-1-questions.json", "sourceQuestion": 13, "stemHtml": "<p>除平凡树之外，树都不是哈密尔顿图。<\/p>", "optionsHtml": "", "explanation": "非平凡树没有圈，不能有哈密尔顿回路。", "noteType": "", "note": "", "verified": true, "searchText": "13 【判断题】 除平凡树之外，树都不是哈密尔顿图。 我的答案： 对 5.9分"}, {"id": "405618867", "chapter": "3.1", "chapterName": "树及其等价定义", "type": "判断题", "answer": "对", "score": 5.9, "source": "shen-3-1-questions.json", "sourceQuestion": 17, "stemHtml": "<p>除平凡树之外，树都不是欧拉图。<\/p>", "optionsHtml": "", "explanation": "非平凡树有度为 1 的叶子，不满足欧拉图所有顶点偶度的条件。", "noteType": "", "note": "", "verified": true, "searchText": "17 【判断题】 除平凡树之外，树都不是欧拉图。 我的答案： 对 5.9分"}, {"id": "405618717", "chapter": "3.2", "chapterName": "生成树", "type": "判断题", "answer": "错", "score": 33.3, "source": "yaxin-3-2-questions.json", "sourceQuestion": 2, "stemHtml": "<p>图<em>G<\/em>是n个结点m条边的连通图，要求<em>G<\/em>的一棵生成树，则要删去<em>G<\/em>中<em>m<\/em>−<em>n<\/em>条边。<\/p>", "optionsHtml": "", "explanation": "生成树保留 n−1 条边，应删去 m−(n−1)=m−n+1 条。", "noteType": "", "note": "", "verified": true, "searchText": "2 【判断题】 图G是n个结点m条边的连通图，要求G的一棵生成树，则要删去G中m−n条边。 我的答案： 错 33.3分"}, {"id": "405618718", "chapter": "3.2", "chapterName": "生成树", "type": "判断题", "answer": "错", "score": 33.3, "source": "yaxin-3-2-questions.json", "sourceQuestion": 1, "stemHtml": "<p>设图<em>G<\/em>是无向连通图，<em>G<\/em>的生成子图<em>T <\/em>称为<em>G<\/em>的生成树。<\/p>", "optionsHtml": "", "explanation": "生成子图还必须本身为树，才能称为生成树；仅有相同顶点集不够。", "noteType": "", "note": "", "verified": true, "searchText": "1 【判断题】 设图G是无向连通图，G的生成子图T 称为G的生成树。 我的答案： 错 33.3分"}, {"id": "405618719", "chapter": "3.2", "chapterName": "生成树", "type": "判断题", "answer": "对", "score": 33.4, "source": "yaxin-3-2-questions.json", "sourceQuestion": 3, "stemHtml": "<p>设<em>G <\/em>=&lt; <em>V<\/em>, <em>E <\/em>&gt;是连通图，<em>e<\/em>∈<em>E<\/em>是<em>G<\/em>的割边，则<em>e<\/em>在<em>G<\/em>的每棵生成树中。<\/p>", "optionsHtml": "", "explanation": "若生成树不含某条桥，就无法连通该桥分隔的两侧顶点。", "noteType": "", "note": "", "verified": true, "searchText": "3 【判断题】 设G =< V, E >是连通图，e∈E是G的割边，则e在G的每棵生成树中。 我的答案： 对 33.4分"}, {"id": "405618841", "chapter": "3.3", "chapterName": "根树及其应用", "type": "单选题", "answer": "C", "score": 20.0, "source": "shen-3-3-questions.json", "sourceQuestion": 1, "stemHtml": "<p><em>T <\/em>为完全二叉树，有<em>t<\/em>片树叶， <em>e<\/em>条边，则有（ ）。<\/p>", "optionsHtml": "<ul>\n                                            <li><i>A、<\/i><p><em>e <\/em>&gt; 2 (<em>t <\/em>−1)<\/p><\/li>\n                                                                        <li><i>B、<\/i><p><em>e <\/em>&lt; 2 (<em>t <\/em>−1)<\/p><\/li>\n                                                                                                            <li><i>C、<\/i><p><em>e <\/em>= 2 (<em>t <\/em>−1)<\/p><\/li>\n                                                                                                    <li><i>D、<\/i><p><em>e <\/em>= 2 (<em>t <\/em>+1)<\/p><\/li>\n                                                <\/ul>", "explanation": "按本课程的满二叉树约定，内部顶点数为 t−1，边数 e=2(t−1)。", "noteType": "术语约定", "note": "本课程在此使用每个内部顶点恰有两个孩子的满二叉树关系。不要直接套用计算机课程中“完全二叉树”的层序定义。", "verified": true, "searchText": "1 【单选题】 T 为完全二叉树，有t片树叶， e条边，则有（ ）。 A、 e > 2 (t −1) B、 e < 2 (t −1) C、 e = 2 (t −1) D、 e = 2 (t +1) 我的答案： C 20.0分"}, {"id": "405618842", "chapter": "3.3", "chapterName": "根树及其应用", "type": "单选题", "answer": "A", "score": 20.0, "source": "shen-3-3-questions.json", "sourceQuestion": 2, "stemHtml": "<p>下面给出的符号串集合中，哪一个是前缀码（ ）。<\/p>", "optionsHtml": "<ul>\n                                                                                <li><i>A、<\/i><p>{1，01，001，000}<\/p><\/li>\n                                                                                                    <li><i>B、<\/i><p>{1，11，101，001，0011}<\/p><\/li>\n                                                                        <li><i>C、<\/i><p>{<em>b<\/em>，<em>c<\/em>，<em>aa<\/em>，<em>bc<\/em>，<em>aba<\/em>}<\/p><\/li>\n      <li><i>C、<\/i><p>G中的任意一个结点与S中的至少一条边关联。<\/p>\n<p><br><\/p><\/li>\n                                                                                                    <li><i>D、<\/i><p>S中的边覆盖是唯一的。<\/p>\n<p><br><\/p><\/li>\n                                                <\/ul>", "explanation": "边覆盖要求每个顶点至少关联集合中的一条边；不要求集合中的边彼此相邻。", "noteType": "", "note": "", "verified": true, "searchText": "4 【多选题】 下列关于图G的边覆盖S说法正确的是（）。 A、 S可以为空。 B、 S中的任意两条边相邻。 C、 G中的任意一个结点与S中的至少一条边关联。 D、 S中的边覆盖是唯一的。 我的答案： C 10.0分"}, {"id": "405619111", "chapter": "5.1", "chapterName": "独立集、覆盖与团", "type": "多选题", "answer": "AB", "score": 10.0, "source": "shen-5-1-questions.json", "sourceQuestion": 4, "stemHtml": "<p>关于图G的团T,下列说法正确的是（）。<\/p>", "optionsHtml": "<ul>\n                                                                                <li><i>A、<\/i><p>T中任意两个点都相邻。<\/p>\n<p><br><\/p><\/li>\n                                                                                                                                        <li><i>B、<\/i><p>G[T]是完全图。<\/p>\n<p><br><\/p><\/li>\n                                                                                                    <li><i>C、<\/i><p>G中的任意一条边至少有一个结点点属于T。<\/p>\n<p><br><\/p><\/li>\n                                                                        <li><i>D、<\/i><p>T可以是空集。<\/p><\/li>\n                                                <\/ul>", "explanation": "团中的任意两顶点相邻，等价于诱导子图完全。平台采用非空团的约定。", "noteType": "空集约定", "note": "平台不接受空团；采用允许空团的教材时，D 的判断会不同。", "verified": true, "searchText": "4 【多选题】 关于图G的团T,下列说法正确的是（）。 A、 T中任意两个点都相邻。 B、 G[T]是完全图。 C、 G中的任意一条边至少有一个结点点属于T。 D、 T可以是空集。 我的答案： AB 10.0分"}, {"id": "405619112", "chapter": "5.1", "chapterName": "独立集、覆盖与团", "type": "多选题", "answer": "AB", "score": 10.0, "source": "shen-5-1-questions.json", "sourceQuestion": 5, "stemHtml": "关于图G的极大团下列说法正确的是（）。", "optionsHtml": "<ul>\n                                                                                <li><i>A、<\/i><p>极大团是图G的顶点集的非空子集。<\/p>\n<p><br><\/p><\/li>\n                                                                                                                                        <li><i>B、<\/i><p>S是G的极大团当且仅当S是图G的补图的极大独立集。<\/p>\n<p><br><\/p><\/li>\n                                                                                                    <li><i>C、<\/i><p>极大团是唯一的。<\/p>\n<p><br><\/p><\/li>\n                                                                        <li><i>D、<\/i><p>所有极大团的大小是一样的。<\/p>\n<p><br><\/p><\/li>\n                                                <\/ul>", "explanation": "在补图中，相邻与不相邻对换，所以极大团对应补图的极大独立集；极大团的大小不必相同。", "noteType": "", "note": "", "verified": true, "searchText": "5 【多选题】 关于图G的极大团下列说法正确的是（）。 A、 极大团是图G的顶点集的非空子集。 B、 S是G的极大团当且仅当S是图G的补图的极大独立集。 C、 极大团是唯一的。 D、 所有极大团的大小是一样的。 我的答案： AB 10.0分"}, {"id": "405619113", "chapter": "5.1", "chapterName": "独立集、覆盖与团", "type": "多选题", "answer": "AD", "score": 10.0, "source": "shen-5-1-questions.json", "sourceQuestion": 6, "stemHtml": "关于图G的极小点覆盖，下列说法正确的是（）。", "optionsHtml": "<ul>\n                                                                                <li><i>A、<\/i><p>最小点覆盖必是极小点覆盖。<\/p>\n<p><br><\/p><\/li>\n                                                                                                    <li><i>B、<\/i><p>最小点覆盖是唯一的。<\/p>\n<p><br><\/p><\/li>\n                                                                        <li><i>C、<\/i><p>图G的极小点覆盖的集合的大小是一样的。<\/p>\n<p><br><\/p><\/li>\n                                                                                                            <li><i>D、<\/i><p>任意的点覆盖必含一个极小点覆盖。<\/p>\n<p><br><\/p><\/li>\n                                                                            <\/ul>", "explanation": "最小覆盖一定极小；从任意覆盖中不断删除冗余顶点，可以得到极小覆盖。", "noteType": "", "note": "", "verified": true, "searchText": "6 【多选题】 关于图G的极小点覆盖，下列说法正确的是（）。 A、 最小点覆盖必是极小点覆盖。 B、 最小点覆盖是唯一的。 C、 图G的极小点覆盖的集合的大小是一样的。 D、 任意的点覆盖必含一个极小点覆盖。 我的答案： AD 10.0分"}, {"id": "405619114", "chapter": "5.1", "chapterName": "独立集、覆盖与团", "type": "多选题", "answer": "ABC", "score": 10.0, "source": "yaxin-5-1-questions.json", "sourceQuestion": 8, "stemHtml": "<p>关于图G的极小点覆盖S,下列说法正确的是（）。<\/p>", "optionsHtml": "<ul>\n                                                                                <li><i>A、<\/i><p>S非空。<\/p>\n<p><br><\/p><\/li>\n                                                                                                                                        <li><i>B、<\/i><p>任意加入不在S中的非孤立结点后，至少有两个结点相邻。<\/p>\n<p><br><\/p><\/li>\n                                                                                                                                        <li><i>C、<\/i><p>任意去掉S中的任何结点之后，G中至少有一条边不与S中的结点关联。<\/p>\n<p><br><\/p><\/li>\n                                                                                                    <li><i>D、<\/i><p>去掉S中的某些点之后，S还是点覆盖。<\/p>\n<p><br><\/p><\/li>\n                                                                        <li><i>E、<\/i><p>图G的极小点覆盖是唯一的。<\/p>\n<p><br><\/p><\/li>\n                                                <\/ul>", "explanation": "极小覆盖不能再删点；覆盖的补集独立，所以在其中加入一个非孤立点，必与原集合中的顶点相邻。", "noteType": "", "note": "", "verified": true, "searchText": "8 【多选题】 关于图G的极小点覆盖S,下列说法正确的是（）。 A、 S非空。 B、 任意加入不在S中的非孤立结点后，至少有两个结点相邻。 C、 任意去掉S中的任何结点之后，G中至少有一条边不与S中的结点关联。 D、 去掉S中的某些点之后，S还是点覆盖。 E、 图G的极小点覆盖是唯一的。 我的答案： ABC 10.0分"}, {"id": "405619115", "chapter": "5.1", "chapterName": "独立集、覆盖与团", "type": "多选题", "answer": "ACEF", "score": 10.0, "source": "shen-5-1-questions.json", "sourceQuestion": 7, "stemHtml": "关于图G的极大独立集S，下列说法正确的是（）。", "optionsHtml": "<ul>\n                                                                                <li><i>A、<\/i><p>任意在S中加一个不在S中G的结点，加入的顶点必至少和S中的某个顶点相邻。<\/p>\n<p><br><\/p><\/li>\n                                                                                                    <li><i>B、<\/i><p>极大独立集是唯一的。<\/p>\n<p><br><\/p><\/li>\n                      <li><i>B、<\/i><p>完美匹配一定是最大匹配。<\/p>\n<p><br><\/p><\/li>\n                                                                                                    <li><i>C、<\/i><p>最大匹配饱和每一个结点。<\/p>\n<p><br><\/p><\/li>\n                                                                                                            <li><i>D、<\/i><p>完美匹配饱和每一个结点。<\/p>\n<p><br><\/p><\/li>\n                                                                            <\/ul>", "explanation": "完美匹配饱和全部顶点，已达到匹配大小的上界；一般最大匹配仍可能有未饱和点。", "noteType": "", "note": "", "verified": true, "searchText": "4 【多选题】 关于图G的最大匹配及完美匹配下列说法正确的是（）。 A、 最大匹配一定是完美匹配。 B、 完美匹配一定是最大匹配。 C、 最大匹配饱和每一个结点。 D、 完美匹配饱和每一个结点。 我的答案： BD 20.0分"}, {"id": "405618850", "chapter": "5.5", "chapterName": "匹配（5.3—5.5）", "type": "多选题", "answer": "BD", "score": 20.0, "source": "shen-5-5-questions.json", "sourceQuestion": 5, "stemHtml": "关于图G的匹配M的定义,下列说法不正确的是（）。", "optionsHtml": "<ul>\n                                            <li><i>A、<\/i><p>匹配M是边集合的非空子集。<\/p>\n<p><br><\/p><\/li>\n                                                                                                            <li><i>B、<\/i><p>匹配M中的边可以相邻。<\/p>\n<p><br><\/p><\/li>\n                                                                                                    <li><i>C、<\/i><p>匹配M是边独立集。<\/p>\n<p><br><\/p><\/li>\n                                                                                                            <li><i>D、<\/i><p>匹配与图的边的方向有关。<\/p>\n<p><br><\/p><\/li>\n                                                                            <\/ul>", "explanation": "匹配中的边两两不相邻，与无向图边的方向无关。平台采用非空匹配的课程约定。", "noteType": "空集约定", "note": "平台按非空匹配定义，满分选 BD。采用允许空匹配的定义时，A 的“非空”也不应作为必要条件。", "verified": true, "searchText": "5 【多选题】 关于图G的匹配M的定义,下列说法不正确的是（）。 A、 匹配M是边集合的非空子集。 B、 匹配M中的边可以相邻。 C、 匹配M是边独立集。 D、 匹配与图的边的方向有关。 我的答案： BD 20.0分"}, {"id": "405619119", "chapter": "6.1", "chapterName": "平面图", "type": "多选题", "answer": "ACDE", "score": 14.2, -6-1-questions.json", "sourceQuestion": 3, "stemHtml": "关于平面图，下列说法正确的是（）。", "optionsHtml": "<ul>\n                                            <li><i>A、<\/i><p>设𝐺 是有10个结点、3个面、2个连通分支的平面图，且𝐺的各个面的度数至少为5，则G的边数m小于等于10.<\/p>\n<p><br><\/p><\/li>\n                                                                        <li><i>B、<\/i><p>若G为平面图，有2个连通分支，10条边，3个面，则G有9个结点。<\/p>\n<p><br><\/p><\/li>\n                                                                                                            <li><i>C、<\/i>若G为平面图，有2个连通分支，10条边，3个面，则G有10个结点。<\/li>\n                                                                                                                                        <li><i>D、<\/i><p>设𝐺 是有10个结点、3 个面、2个连通分支的平面图，且𝐺的各个面的度数至少为5，则G的边数m小于等于11。<\/p>\n<p><br><\/p><\/li>\n                                                                                                                                        <li><i>E、<\/i><p>任意简单平面图的最小度小于等于5。<\/p>\n<p><br><\/p><\/li>\n                                                                            <\/ul>", "explanation": "一般平面图满足 n−m+f=1+c，故第二组数据有 n=10。平台接受 CDE；选项 A 与所给精确面数存在判分争议。", "noteType": "判分疑点", "note": "平台满分组合为 CDE。按题面 n=10、f=3、c=2 和欧拉公式，m=10，因此 A 的 m≤10 也成立。保留平台答案与这一数学矛盾。", "verified": true, "searchText": "3 【多选题】 关于平面图，下列说法正确的是（）。 A、 设𝐺 是有10个结点、3个面、2个连通分支的平面图，且𝐺的各个面的度数至少为5，则G的边数m小于等于10. B、 若G为平面图，有2个连通分支，10条边，3个面，则G有9个结点。 C、 若G为平面图，有2个连通分支，10条边，3个面，则G有10个结点。 D、 设𝐺 是有10个结点、3 个面、2个连通分支的平面图，且𝐺的各个面的度数至少为5，则G的边数m小于等于11。 E、 任意简单平面图的最小度小于等于5。 我的答案： CDE 14.3分"}, {"id": "405619125", "chapter": "6.1", "chapterName": "平面图", "type": "判断题", "answer": "错", "score": 14.3, "source": "shen-6-1-questions.json", "sourceQuestion": 7, "stemHtml": "【判断题】同一个可平面图的平面嵌入，外部面具有相同的度。", "optionsHtml": "", "explanation": "改变平面嵌入时，可将不同度数的面选作外部面，因此外部面度不必相同。", "noteType": "", "note": "", "verified": true, "searchText": "7 【判断题】 【判断题】同一个可平面图的平面嵌入，外部面具有相同的度。 我的答案： 错 14.3分"}, {"id": "405618831", "chapter": "6.5", "chapterName": "对偶图与着色（6.2—6.6）", "type": "多选题", "answer": "AC", "score": 11.1, "source": "shen-6-5-questions.json", "sourceQuestion": 1, "stemHtml": "关于图G的对偶图下列说法正确的是（）。", "optionsHtml": "<ul>\n                                                                                <li><i>A、<\/i>不含孤立结点的平面图的对偶图是平面图。<\/li>\n                                                                                                    <li><i>B、<\/i>不含孤立结点的平面图的对偶图可以是不连通的。<\/li>\n                                                                                                            <li><i>C、<\/i>不含孤立结点的同构的平面图的对偶图也是同构的。<\/li>\n                                                                                                    <li><i>D、<\/i>不含孤立结点的平面图的对偶图一定含有平行边。<\/li>\n                                                <\/ul>", "explanation": "对偶图仍可平面且连通。平台接受 AC；C 需要按保持嵌入关系的平面图同构理解。", "noteType": "同构约定", "note": "平台接受 AC。若只要求抽象图同构而不保持嵌入，不同嵌入的对偶图不一定同构；应区分平面嵌入与抽象可平面图。", "verified": true, "searchText": "1 【多选题】 关于图G的对偶图下列说法正确的是（）。 A、 不含孤立结点的平面图的对偶图是平面图。 B、 不含孤立结点的平面图的对偶图可以是不连通的。 C、 不含孤立结点的同构的平面图的对偶图也是同构的。 D、 不含孤立结点的平面图的对偶图一定含有平行边。 我的答案： AC 11.1分"}, {"id": "405618832", "chapter": "6.5", "chapterName": "对偶图与着色（6.2—6.6）", "type": "多选题", "answer": "AB", "score": 11.1, "source": "shen-6-5-questions.json", "sourceQuestion": 2, "stemHtml": "关于图G的对偶图下列说法正确的是（）。", "optionsHtml": "<ul>\n                                                                                <li><i>A、<\/i>图G的对偶图的边数等于图G的边数。<\/li>\n                                                                                                                                        <li><i>B、<\/i>图G的对偶图的结点数等于图G的面数。<\/li>\n                                                                                                    <li><i>C、<\/i>图G的对偶图的面数等于图G的顶点数。<\/li>\n                                                                        <li><i>D、<\/i>图G的对偶图的面数和图G的面数相等。<\/li>\n                                                <\/ul>", "explanation": "每条原边对应一条对偶边，每个原面对应一个对偶顶点。原图不连通时，对偶面数不必等于原顶点数。
